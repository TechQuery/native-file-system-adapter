name: Test & Publish

on:
  push:

permissions:
  contents: read

jobs:
  wpt-node:
    name: WPT Tests (Node.js)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm ci
      - name: Fetch WPT tests
        run: bash scripts/fetch-wpt.sh
      - name: Run WPT tests (Node.js)
        run: pnpm test:wpt-node

  wpt-browser:
    name: WPT Tests (Browsers)
    runs-on: ubuntu-latest
    needs: wpt-node
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm ci
      - name: Install Playwright browsers
        run: pnpx playwright install --with-deps chromium firefox webkit
      - name: Fetch WPT tests
        run: bash scripts/fetch-wpt.sh
      - name: Run WPT tests (Browsers)
        run: pnpm test:wpt-browser
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Publish Package
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Skipping publish because NODE_AUTH_TOKEN is not set."
            exit 0
          fi
          publish_args=(--access public --provenance --no-git-checks)

          if [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.*[[:alpha:]].*$ ]]; then
            publish_args+=(--tag next)
          fi
          pnpm publish "${publish_args[@]}"
